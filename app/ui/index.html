<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>MatiQ Solutions</title>
    <link rel="stylesheet" href="../../packages/shell/shell.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <aside class="suite-sidebar">
      <img
        src="../../packages/shell/assets/matiq-solutions-wordmark-dark.png"
        alt="MatiQ Solutions"
      />
      <nav aria-label="Main navigation">
        <button data-page="library">My tools</button
        ><button data-page="marketplace">Marketplace</button
        ><button data-page="updates">Downloads &amp; updates</button
        ><button data-page="settings">Settings</button>
      </nav>
      <div id="open-tools" aria-label="Open tools"></div>
      <p>On your device.<br />Your tools. Your choice.</p>
    </aside>
    <div class="suite-workspace">
      <header>
        <h1 id="title">My tools</h1>
        <button id="return" hidden>Back to my tools</button>
      </header>
      <main id="content"><p>Loading your installed tools…</p></main>
      <p id="error" role="alert" hidden></p>
      <p id="activity" role="status"></p>
    </div>
    <script src="app.js"></script>
  </body>
</html>
