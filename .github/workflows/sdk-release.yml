name: Publish versioned SDK
on:
  push:
    tags: ['sdk-v*']
permissions:
  contents: read
jobs:
  qualification:
    uses: ./.github/workflows/checks.yml
  publish:
    needs: qualification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require SDK source merged into main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify SDK tag matches every shared package
        run: |
          node -e 'for (const name of ["sdk","runtime","shell"]) { const version=require("./packages/"+name+"/package.json").version; if(process.env.GITHUB_REF_NAME!=="sdk-v"+version) throw Error("SDK tag and shared package versions disagree"); }'
      - run: node scripts/package-sdk.cjs dist/sdk
      - name: Publish immutable package archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/sdk/*.tgz --verify-tag --title "MatiQ Solutions SDK ${GITHUB_REF_NAME#sdk-v}" --notes "Shared shell, runtime and SDK. Tool implementations remain in their own repositories." --prerelease
